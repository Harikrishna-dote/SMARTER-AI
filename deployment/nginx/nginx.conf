# Gzip + Brotli-style compression settings for responses proxied from the API.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    application/x-javascript
    text/plain
    text/css
    text/xml
    application/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;

    # Clients may hold a warm TCP/keepalive connection to nginx.
    keepalive_timeout 65;
    keepalive_requests 1000;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /api/v1/chats/ws/ {
        proxy_pass http://backend:8000/api/v1/chats/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Hashed, immutable static assets: cache forever and never revalidate.
    location /assets/ {
        proxy_pass http://frontend:5173/assets/;
        proxy_set_header Host $host;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    location / {
        proxy_pass http://frontend:5173/;
        proxy_set_header Host $host;
        # The index HTML should always be fresh so new deploys are picked up.
        add_header Cache-Control "no-cache";
    }
}
